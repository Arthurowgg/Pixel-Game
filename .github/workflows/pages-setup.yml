name: Point Pages at the Actions build

# One-off: the site was published with "deploy from a branch", so GitHub served the
# repository root — including the Vite dev index.html — and the game never booted.
# Switching the Pages site to build_type=workflow makes the tested dist/ artifact
# the published site. Safe to re-run; it only sets the source type.
on:
  workflow_dispatch:

permissions:
  pages: write

jobs:
  configure:
    runs-on: ubuntu-latest
    steps:
      - name: Set the Pages source to GitHub Actions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          code=$(curl -sS -o /tmp/pages.json -w '%{http_code}' -X PUT \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPO/pages" \
            -d '{"build_type":"workflow"}')
          cat /tmp/pages.json
          if [ "$code" = "204" ] || [ "$code" = "200" ]; then
            echo "Pages now builds from GitHub Actions."
          else
            echo "Pages update returned HTTP $code" >&2
            exit 1
          fi
      - name: Report the published configuration
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          curl -sS -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/pages" | tee /tmp/state.json
          grep -q '"build_type":"workflow"' /tmp/state.json
