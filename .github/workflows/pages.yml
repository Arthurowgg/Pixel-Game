name: Test and deploy Wildpine

on:
  push:
    branches: [main, arena/e14c7254-pixel-game]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write

concurrency:
  group: pages-${{ github.event.pull_request.number || 'production' }}
  cancel-in-progress: false

jobs:
  build:
    name: Test and build the Forest
    runs-on: ubuntu-latest
    steps:
      - name: Check out the game
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Test gameplay, saves, equipment, and animation metadata
        run: npm test
      - name: Build for the repository subpath
        run: npm run build
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
      - name: Verify published asset paths
        run: node scripts/check-pages-build.mjs
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
      - name: Package the site
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    name: Publish to GitHub Pages
    # Pushes only (never a pull_request), on either branch the github-pages
    # environment allows. The site is published from this job's artifact, so a
    # branch deploy always serves the tested dist/ build instead of raw source.
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # The Pages site was previously set to "deploy from a branch", which published
      # the repository root — including the Vite dev index.html — so the bundle never
      # loaded. Pin the site to artifact builds before deploying; the call is idempotent.
      - name: Ensure Pages publishes this artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -sS -o /tmp/pages.json -w '%{http_code}\n' -X PUT \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/pages" \
            -d '{"build_type":"workflow"}' | tee /tmp/status
          code=$(cat /tmp/status)
          if [ "$code" != "204" ] && [ "$code" != "200" ]; then
            echo "::warning::Pages source update returned HTTP $code"
          fi
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Deploy the tested site
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
